---
agent:
  healthPort: 8080
agentId: "agent1"
targets:
- id: "icon-backend"
  rpc:
    endpoint: "ws://localhost:11100/rpc"
    tls:
      keystorePath: "certs/agent.p12"
      keystorePassword: "changeit"
      truststorePath: "certs/truststore.p12"
      truststorePassword: "1234qwer!@"
      keystoreType: "PKCS12"
      insecureTrustAll: false
    reconnectBaseMs: 1000
    reconnectMaxMs: 60000
    ackTimeoutMs: 30000
    compress: false
  collectors:[]
  # [2026-04-22] 배치 설정 — 튜닝 가이드 기본값 적용
  # maxBatchSize    : 배치당 최대 레코드 수 (건수 기준 플러시)
  # maxBatchMs      : 배치 최대 대기 시간 ms (시간 기준 플러시)
  # maxBatchBytes   : 배치당 최대 바이트 크기 (0=제한없음, 크기 기준 플러시)
  # maxBatchesPerSecond : 초당 최대 배치 전송 수 (0=무제한, 서버 부하 조절)
  # queueCapacity   : 대상별 인메모리 레코드 큐 크기
  queueCapacity: 10000
  maxBatchSize: 500
  maxBatchMs: 5000
  maxBatchBytes: 524288
  maxBatchesPerSecond: 10
monitoring:
  enabled: true
  intervalMs: 30000
  logPath: "logs/agent-metrics.log"
  spoolRootPath: "data"
