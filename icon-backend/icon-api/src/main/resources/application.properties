spring.application.name=icon-api
# Allow bean definition overriding (icon-api + icon-engine 통합)
spring.main.allow-bean-definition-overriding=true
spring.profiles.include=api
server.port=11100
server.address=0.0.0.0

# datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/icon
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA/Hibernate 설정
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false

# SQL 로그 설정 (깔끔한 쿼리만)
#logging.level.org.hibernate.SQL=INFO
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# 불필요한 로그 비활성화
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.boot.autoconfigure=WARN

# 애플리케이션 로그 레벨
logging.level.com.itmasters.icon=DEBUG

spring.jpa.properties.hibernate.default_batch_fetch_size=1000
spring.jpa.properties.hibernate.jdbc.batch_size=1000

# [2026-04-23] 에이전트 배치 처리 스레드 풀 설정 (ingestTaskExecutor)
# 에이전트 배치 대량 수신 시 SimpleAsyncTaskExecutor 폴백으로 스레드 1312개 생성 → CPU 97% 발생했던 문제 해결
# core-pool-size : 평상시 유지 스레드 수
# max-pool-size  : 큐 포화 시 최대 확장 스레드 수 (burst 대응)
# queue-capacity : 스레드 포화 전 대기 큐 크기 (max-pool-size 도달 전 버퍼)
# * 큐 + max-pool 모두 초과 시 CallerRunsPolicy (호출 스레드 직접 실행, 데이터 유실 방지)
icon.engine.async.ingest.core-pool-size=10
icon.engine.async.ingest.max-pool-size=50
icon.engine.async.ingest.queue-capacity=500

# [2026-04-23] 엔티티 관계 처리 스레드 풀 설정 (relationTaskExecutor, PREP-4/5-A/5-B)
icon.engine.async.relation.core-pool-size=2
icon.engine.async.relation.max-pool-size=4
icon.engine.async.relation.queue-capacity=100

