spring.application.name=icon-api
# Allow bean definition overriding (icon-api + icon-engine 통합)
spring.main.allow-bean-definition-overriding=true
spring.profiles.include=api
server.port=11100
server.address=0.0.0.0

# datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/icon
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA/Hibernate 설정
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false

# SQL 로그 설정 (깔끔한 쿼리만)
#logging.level.org.hibernate.SQL=INFO
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# 불필요한 로그 비활성화
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.boot.autoconfigure=WARN

# 애플리케이션 로그 레벨
logging.level.com.itmasters.icon=DEBUG

spring.jpa.properties.hibernate.default_batch_fetch_size=1000
spring.jpa.properties.hibernate.jdbc.batch_size=1000

# JWT
jwt.secret=swcIrv0u99DX5uulY+rkvzlGlYHnzwbAYPb7rQrvWO7QsQudGki4Q75c14BLA/wR1Cp3CBhrTb3uWW7WMoccOQ==
# 1시간 (밀리초)
jwt.expiration-ms=3600000
# 7일 (밀리초)
jwt.refresh-expiration-ms=604800000

# AI Chat Webhook Configuration (n8n)
# ai.chat.webhook.url=[AI 챗 웹훅 URL]
# ai.chat.webhook.api-key=[AI 챗 웹훅 API 키]

# 로그 파일 설정 (Spring Boot 3.x)
#logging.file.name=/Users/dgpark/git/side-project/it-masters/icon/backend/icon-api/logs/icon-api.log
logging.file.name=logs/icon-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# 로그 레벨 전역 설정
logging.level.root=INFO
logging.level.org.hibernate=OFF
logging.level.org.springframework=WARN

# 엔진 상세 로그 활성화
logging.level.com.itmasters.icon.engine=DEBUG
logging.level.com.itmasters.icon.engine.processor=DEBUG
logging.level.com.itmasters.icon.engine.service.MainEngineService=DEBUG
logging.level.com.itmasters.icon.engine.processor.detect=DEBUG
logging.level.com.itmasters.icon.engine.processor.sync=DEBUG
logging.level.com.itmasters.icon.engine.evaluator=DEBUG
logging.level.com.itmasters.icon.engine.mapping.ProfileSchemaMappingEngine=DEBUG
